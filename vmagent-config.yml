global:
  scrape_interval: 15s

scrape_configs:
    - job_name: vmagent
      static_configs:
        - targets: ['vmagent:8429']

    - job_name: victoriametrics
      static_configs:
        - targets: ['victoriametrics:8428']

    - job_name: os-metrics-scraper
      static_configs:
        - targets: [scraper.eks.iiaxsisii.net:80]
      metrics_path: /metrics

    - job_name: metrics-reporter
      static_configs:
        - targets: [reporter.eks.iiaxsisii.net:80]
      metrics_path: /metrics

    - job_name: node-exporter
      static_configs:
        - targets: [node-exporter.eks.iiaxsisii.net:80]
      metrics_path: /metrics

    - job_name: kube-state-metrics
      static_configs:
        - targets: [kube-state-metrics.eks.iiaxsisii.net:80]
      metrics_path: /metrics

    - job_name: envoy-scraper
      static_configs:
        - targets: [envoy-scraper.eks.iiaxsisii.net:80]
      metrics_path: /stats/prometheus

    - job_name: envoy-reporter
      static_configs:
        - targets: [envoy-reporter.eks.iiaxsisii.net:80]
      metrics_path: /stats/prometheus

    - job_name: istiod
      static_configs:
        - targets: [istiod.eks.iiaxsisii.net:80]
      metrics_path: /metrics

